name: Deploy to production

on:
  push:
    branches:
      - main
      # TEMPORARY (M6 bootstrap only): workflow_dispatch can't target a workflow
      # GitHub has never seen run anywhere. This entry exists just to get one
      # real push-triggered run recorded, then gets removed in a follow-up
      # commit before M6 closes — this workflow should only ever fire for
      # real on a push to main.
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - name: Trigger Vercel deploy hook
        run: curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
